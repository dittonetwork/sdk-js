name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Basic permissions for npm publishing
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Make sure we get all tags
          fetch-tags: true
          # Use PAT instead of GITHUB_TOKEN
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          # Use authentication with the PAT to avoid permission issues
          git remote set-url origin https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/dittonetwork/sdk-js.git
          git fetch
          # Ensure we're on the correct branch with up-to-date information
          git checkout master
          git pull --rebase origin master

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm i

      - name: TypeScript Type Check
        run: pnpm tsc --noEmit --project ./packages/core/tsconfig.json

      - name: Lint
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Setup npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_ACCESS_TOKEN }}" > ~/.npmrc
          npm config set access public

      - name: Semantic Release Core Package
        run: |
          cd packages/core
          # Debug output to understand repo state
          echo "Current git status:"
          git status

          # Important: Proper Git authentication setup
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Configure the correct repository URL with token
          echo "Setting up Git remote with token authentication"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/dittonetwork/sdk-js.git
          git remote -v

          # Force synchronize with remote before release
          echo "Forcing sync with remote branch..."
          # First, fetch everything from remote
          git fetch --all --force
          # Reset to remote state completely
          git reset --hard origin/master
          # Clean any untracked files
          git clean -fd
          # Verify we're on master
          git checkout master
          # Pull with force
          git pull --force origin master

          # Verify branch state after reset
          echo "Branch state after reset:"
          git status
          echo "Last commit:"
          git log -1 --oneline
          echo "Remote commit:"
          git log -1 origin/master --oneline

          # Make sure the branch is definitely in sync
          git merge-base --is-ancestor HEAD origin/master || echo "Branch is still not in sync after reset!"

          # Commit any changes from previous steps (lint, build, etc)
          git add -A
          git commit -m "chore: automated changes before release [skip ci]" || echo "No changes to commit"

          # Install dependencies locally
          echo "Installing semantic-release and plugins"
          npm install --no-save semantic-release semantic-release-monorepo @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/npm @semantic-release/git

          # Check existing configuration
          echo "Existing .releaserc.json content:"
          cat .releaserc.json || echo "No existing .releaserc.json found"

          # Output package.json contents for verification
          echo "Current package.json:"
          cat package.json

          # Run semantic-release with debug
          echo "Running semantic-release with debugging enabled"
          export NODE_DEBUG=semantic-release,semantic-release:*
          export GH_TOKEN=${GITHUB_TOKEN}
          export GITHUB_TOKEN=${GITHUB_TOKEN}
          # Use semantic-release-monorepo with configuration from .releaserc.json
          npx semantic-release -e semantic-release-monorepo
        env:
          NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
