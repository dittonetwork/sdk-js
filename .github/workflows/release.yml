name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Basic permissions for npm publishing
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Make sure we get all tags
          fetch-tags: true
          # Use PAT instead of GITHUB_TOKEN
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          # Use authentication with the PAT to avoid permission issues
          git remote set-url origin https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/dittonetwork/sdk-js.git
          git fetch
          # Ensure we're on the correct branch with up-to-date information
          git checkout master
          git pull --rebase origin master

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm i

      - name: Fix Code Style
        run: pnpm lint:fix

      - name: TypeScript Type Check
        run: pnpm tsc --noEmit --project ./packages/core/tsconfig.json

      - name: Lint
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Setup npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_ACCESS_TOKEN }}" > ~/.npmrc
          npm config set access public

      - name: Semantic Release Core Package
        run: |
          cd packages/core
          # Debug output to understand repo state
          echo "Current git status:"
          git status

          # Ensure we're fully synced with remote before running semantic-release
          git fetch --prune --unshallow || git fetch --prune
          git checkout master

          # Save local changes before rebasing
          git stash -u

          # Force reset to match remote exactly
          git reset --hard origin/master

          # Pull latest changes
          git pull origin master

          # Restore local changes
          git stash pop || true

          # Show status after syncing
          echo "Git status after sync:"
          git status
          git log -n 3 --oneline

          # Install dependencies locally
          npm install --no-save semantic-release semantic-release-monorepo @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/npm

          # Create/update .releaserc.json to force publishing
          cat > .releaserc.json << EOF

          # Run semantic-release with more debugging and forced parameters
          DEBUG=semantic-release:* npx semantic-release --no-ci
        env:
          NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
