name: Release

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Basic permissions for npm publishing
permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Make sure we get all tags
          fetch-tags: true
          # Use PAT instead of GITHUB_TOKEN
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Git Setup
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name  "GitHub Actions"
          git remote set-url origin https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/dittonetwork/sdk-js.git

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"

      - name: Download Build Artifacts
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: ci.yml
          workflow_conclusion: success
          name: build-artifacts
          path: packages
          github_token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_ACCESS_TOKEN }}" > ~/.npmrc
          npm config set access public

      - name: Prepare for Release
        run: |
          # Получаем все теги и обеспечиваем синхронизацию с origin/master
          git fetch --tags --force
          git fetch origin master --force
          # Переключаемся на ветку master и сбрасываем ее до состояния origin/master
          git checkout master
          git reset --hard origin/master
          # Проверяем, что локальная ветка в актуальном состоянии
          git status

      - name: Semantic Release Core Package
        run: |
          npx --yes semantic-release -e semantic-release-monorepo
        env:
          NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          DEBUG: semantic-release:*
