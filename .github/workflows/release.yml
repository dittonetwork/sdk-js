name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Basic permissions for npm publishing
permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Make sure we get all tags
          fetch-tags: true

      - name: Configure Git
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git remote set-branches --add origin master
          git fetch
          # Ensure we're on the correct branch with up-to-date information
          git checkout master
          git pull --rebase origin master

      - name: Setup pnpm 8
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm i

      - name: Fix Code Style
        run: pnpm lint:fix

      - name: TypeScript Type Check
        run: pnpm tsc --noEmit --project ./packages/core/tsconfig.json

      - name: Lint
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Setup npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_ACCESS_TOKEN }}" > ~/.npmrc
          npm config set access public

      - name: Semantic Release Core Package (Publish Only)
        run: |
          cd packages/core
          # Create temporary config to disable git
          echo '{
            "branches": ["master"],
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              "@semantic-release/npm"
            ],
            "dryRun": false,
            "ci": false
          }' > .releaserc-temp.json

          # Install dependencies locally
          npm install --no-save semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/npm

          # Run semantic-release with npm-only config
          GITHUB_REF=refs/heads/master \
          CI=false \
          NODE_ENV=production \
          GIT_LOCAL_BRANCH=master \
          npx semantic-release --no-ci --debug --extends ./.releaserc-temp.json
        env:
          NPM_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
